# Tests use an in-memory H2 database in MySQL mode, so no MySQL server is needed.
spring.datasource.url=jdbc:h2:mem:employee_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Used by QueryOptimizationTest to count the SQL statements
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
