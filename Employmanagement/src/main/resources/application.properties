spring.application.name=employee-management-api
server.port=8080

# MySQL connection. Override with the DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are created by database/schema.sql. Hibernate only checks that the
# entity mappings match the tables, it never changes the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Set to true to see the SQL statements (useful for checking the N+1 fix)
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
